  西爾維亞·費德里奇在《卡利班與女巫》（Caliban and the Witch, 2004）中，將原始積累視為資本主義的持續過程，而非馬克思的歷史階段：它不僅剝奪土地，還積累女性身體的差異與分工，讓女性永遠是「弱者」以供支配。
  <br/>
  改變錯誤模式（如父權）需依賴它完成積累——例如，女性主義運動中，女性往往模仿父權符號（如職場支配）來獲取資源，卻無意中重複其階級異化，讓「仇視不同認知」成為規範的自我防衛。費德里奇批判，這是原始積累的女性面相：資本透過女巫獵巫等「積累差異」，讓反抗者內化仇視（對非規範慾望的恐懼），延續霸權。
