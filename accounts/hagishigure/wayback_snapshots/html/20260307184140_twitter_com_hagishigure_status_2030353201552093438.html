  <div class="tweet-content">
  无聊写的超短篇：
  <br/>
  柏拉图没有问过苏格拉底爱不爱她。
  <br/>
  她知道这件事没法用语言证明——不是因为苏格拉底沉默，是因为苏格拉底可以证明任何东西。
  <br/>
  所以她只用眼睛看。
  <br/>
  看她清晨醒来时，第一个动作是摸床头那卷没抄完的残篇。
  <br/>
  看她吃饭时忽然停住，眼神放空，嘴唇微动——她知道她在脑子里和某个看不见的人辩论。
  <br/>
  看她深夜对着烛火发呆，她走过去，她抬头看她，眼神飘忽。
  <br/>
  “你在想什么？”她问。
  <br/>
  “正义。”
  <br/>
  “还有呢？”
  <br/>
  沉默了一下。
  <br/>
  “还有……你明天想吃什么？”
  <br/>
  柏拉图笑了。
  <br/>
  这就是她要的答案。
