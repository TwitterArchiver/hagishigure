  …我对那些说发讣告/某些预告很好玩吗的人是很讨厌的。
  <br/>
  ——
  <br/>
  我以前做过一个不好不坏的梦，记得很清楚，背景板是我还在中国的学校的时候，梦里我在五楼的天台，用尽全身的力气翻过栅栏，看下去离操场有33层楼那么高，很害怕，怕死了就没有轮回了，什么都没有了，连思考这件事的意识也没了，所以一直在想，如果有人来拉我一把，哪怕一个人都好，就不跳了，下次再说吧。
  <br/>
  那个梦的结局已经被我忘了，但我记得梦里人来人往，没有人在意一个在天台上坐着的人。
  <br/>
  所幸现实里那时候还是有陌生人愿意看见我的。
  <br/>
  ——
  <br/>
  所以我很明白，很理解，那些发预告/假讣告的人在想什么。
